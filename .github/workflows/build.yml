name: Build TinyRetroPad Linux CrossCompile
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tools and UASM
        run: |
          sudo apt-get update
          sudo apt-get install -y lld wget unzip
          # Download diretto dell'eseguibile stabile di UASM senza redirezioni corrotte
          wget -q "https://github.com" -O uasm.zip
          unzip uasm.zip
          chmod +x uasm

      - name: Run Build
        run: |
          # Compilazione pulita ignorando maiuscole/minuscole e definizioni di Windows
          ./uasm -coff -win32 -zcm trpad.asm
          # Linker ufficiale di LLVM per Windows
          lld-link /subsystem:windows /entry:start /out:TinyRetroPad-DarkMode.exe trpad.obj

      - name: Upload Executable
        uses: actions/upload-artifact@v4
        with:
          name: TinyRetroPad-DarkMode-Windows
          path: TinyRetroPad-DarkMode.exe
