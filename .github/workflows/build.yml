name: Build TinyRetroPad Official
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Author Build Script
        run: |
          # Esegue il file batch originale dell'autore sfruttando l'ambiente Windows ufficiale di GitHub
          .\build.bat

      - name: Upload Finished Executable
        uses: actions/upload-artifact@v4
        with:
          name: TinyRetroPad-FullOptions
          path: trpad.exe
