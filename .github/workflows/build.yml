name: Build TinyRetroPad Definitive
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Install Official MASM32 Includes
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "C:\masm32\include"
          # Scarica un archivio leggero contenente solo i file .inc ufficiali e collaudati di MASM32
          Invoke-WebRequest -Uri "https://github.com" -OutFile "masm32inc.zip"
          Expand-Archive -Path "masm32inc.zip" -DestinationPath "C:\masm32_temp"
          Copy-Item -Path "C:\masm32_temp\MASM32-Header-Files-master\*.inc" -Destination "C:\masm32\include" -Force

      - name: Run Build with Microsoft Linker
        run: |
          ml.exe /nologo /c /coff /Cp /IC:\masm32\include trpad.asm
          link.exe /nologo /SUBSYSTEM:WINDOWS /ENTRY:start /OUT:TinyRetroPad.exe trpad.obj kernel32.lib user32.lib shell32.lib comdlg32.lib gdi32.lib comctl32.lib Ole32.lib

      - name: Upload Executable
        uses: actions/upload-artifact@v4
        with:
          name: TinyRetroPad-DarkMode
          path: TinyRetroPad.exe
