name: Build TinyRetroPad Linux Native
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linker
        run: |
          sudo apt-get update
          sudo apt-get install -y lld

      - name: Run Build with Native Assembler
        run: |
          # Aggiungiamo al volo la direttiva Intel in cima al file per farlo digerire a Linux
          echo ".intel_syntax noprefix" > temp.asm
          cat trpad.asm >> temp.asm
          
          # Compiliamo usando il tool nativo preinstallato (Target Windows 32-bit)
          i686-w64-mingw32-as -o trpad.obj temp.asm
          
          # Creiamo l'eseguibile finale per Windows
          lld-link /subsystem:windows /entry:start /out:TinyRetroPad-DarkMode.exe trpad.obj

      - name: Upload Executable
        uses: actions/upload-artifact@v4
        with:
          name: TinyRetroPad-DarkMode-Windows
          path: TinyRetroPad-DarkMode.exe
