name: Build TinyRetroPad
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Download Crinkler
        run: |
          Invoke-WebRequest -Uri "https://github.com" -OutFile "crinkler.zip"
          Expand-Archive -Path "crinkler.zip" -DestinationPath "."
          Move-Item -Path "win32/crinkler.exe" -Destination "."

      - name: Run Build
        run: |
          ml.exe /nologo /c /coff /Cp trpad.asm
          .\crinkler.exe /SUBSYSTEM:WINDOWS /ENTRY:start /OUT:TinyRetroPad.exe /NOINITIALIZERS /TINYIMPORT /HASHTRIES:1000 /ORDERTRIES:1000 trpad.obj kernel32.lib user32.lib shell32.lib comdlg32.lib gdi32.lib
